name: CI/CD

# Flujo de ramas (GitFlow):
#   feature/*  ──PR──►  dev  ──PR──►  main
#                        │              │
#                        ▼              ▼
#               Render (dev)    Render (producción)
#   hotfix/*   ──PR──►  main (y luego se integra en dev)
#
#   CI (build + tests): todas las ramas.
#   Imagen Docker + CD: solo main y dev. feature/* y hotfix/* nunca construyen
#   la imagen ni despliegan; su código llega a Render después del merge.
on:
  push:
    branches: [main, dev, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------- Valida que el PR venga de la rama correcta -------------
  branch-policy:
    name: Política de ramas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar origen del PR
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          echo "PR: $SOURCE -> $TARGET"
          case "$TARGET" in
            main)
              if [[ "$SOURCE" == "dev" || "$SOURCE" == hotfix/* ]]; then exit 0; fi
              echo "::error::A main solo se integra desde 'dev' o 'hotfix/*' (recibido: '$SOURCE')"
              exit 1 ;;
            dev)
              if [[ "$SOURCE" == feature/* || "$SOURCE" == hotfix/* || "$SOURCE" == "main" ]]; then exit 0; fi
              echo "::error::A dev solo se integra desde 'feature/*', 'hotfix/*' o 'main' (recibido: '$SOURCE')"
              exit 1 ;;
          esac

  # ---------------- CI: compila y ejecuta todos los tests ----------------
  # Corre en todas las ramas: main, dev, feature/*, hotfix/*
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests (unitarios, integración y servicios)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          retention-days: 7

  # ------------- Verifica que la imagen Docker de Render compila -------------
  # Solo en las ramas que despliegan (main, dev) y en el PR dev -> main.
  # feature/* y hotfix/* NO construyen la imagen (no tienen CD): ni en push ni en sus PR.
  # Un hotfix igual pasa por este job al hacer merge a main, antes de que Render despliegue.
  docker-build:
    name: Build imagen Docker
    needs: build-test
    if: >-
      (github.event_name != 'pull_request' &&
        (github.ref_name == 'main' || github.ref_name == 'dev')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
        !startsWith(github.head_ref, 'hotfix/') && !startsWith(github.head_ref, 'feature/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t ms-productos-ab:${{ github.sha }} .

  # ---------------- CD ----------------
  # Render despliega automáticamente (render.yaml -> autoDeployTrigger: checksPass)
  # cuando todos los checks de este workflow pasan en la rama del servicio:
  #   main -> ms-productos-ab      (producción)
  #   dev  -> ms-productos-ab-dev  (desarrollo)
  # feature/* y hotfix/* no tienen servicio en Render: no se despliegan nunca.
