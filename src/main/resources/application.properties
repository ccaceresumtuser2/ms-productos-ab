spring.application.name=ms-productos-ab
server.port=${PORT:8080}

# Conexión PostgreSQL: las credenciales se leen de variables de entorno
# (o de application-local.properties, que NO se sube a git).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_postgresql_productos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# La tabla ya existe (ver productos.sql): Hibernate solo valida el mapeo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Actuator: solo /actuator/health (usado por Render como health check)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
